spring:
  application:
    name: growth-simulator
  datasource:
    url: jdbc:postgresql://<db_host>:<db_port>/<db_name>
    username: <db_username>
    password: <db_password>
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false

server:
  port: 8080
