<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>성장 중분류 편집</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/growth-manage.css}">
</head>
<body>
<main class="container page-shell py-4">
    <nav class="top-nav">
        <div class="brand-mark">
            <span>성장 중분류 편집</span>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/growth-categories}">목록</a>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/dashboard}">대시보드</a>
        </div>
    </nav>

    <section class="soft-card form-panel">
        <h1 class="h4 mb-3" th:text="${subCategory == null ? '새 중분류 추가' : '중분류 수정'}">새 중분류 추가</h1>
        <form class="quest-form"
              th:action="${subCategory == null ? '/growth-categories/' + category.id + '/sub-categories' : '/growth-sub-categories/' + subCategory.id + '/edit'}"
              th:object="${subCategoryForm}"
              method="post">
            <div>
                <label class="form-label" for="categoryId">대분류</label>
                <select class="form-select" id="categoryId" th:field="*{categoryId}">
                    <option th:each="categoryOption : ${categories}"
                            th:value="${categoryOption.id}"
                            th:text="${categoryOption.displayName}">백엔드</option>
                </select>
            </div>
            <div>
                <label class="form-label" for="name">name</label>
                <input class="form-control" id="name" type="text" th:field="*{name}" required placeholder="예: API_DESIGN">
            </div>
            <div>
                <label class="form-label" for="displayName">표시 이름</label>
                <input class="form-control" id="displayName" type="text" th:field="*{displayName}" required placeholder="예: API 설계">
            </div>
            <div>
                <label class="form-label" for="description">설명</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="4"></textarea>
            </div>
            <div>
                <label class="form-label" for="sortOrder">정렬 순서</label>
                <input class="form-control" id="sortOrder" type="number" th:field="*{sortOrder}">
            </div>
            <div class="text-muted small">
                totalExp와 level은 퀘스트 완료 기록으로 자동 성장하며, 이 화면에서는 직접 수정하지 않습니다.
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/growth-categories}">취소</a>
                <button class="btn btn-primary" type="submit">저장</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
