<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>퀘스트 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/game-ui.css}">
</head>
<body>
<main class="container page-shell py-4">
    <nav th:replace="~{fragments/navigation :: nav('quests')}"></nav>

    <section class="hero-panel mb-4">
        <div class="office-character" aria-hidden="true">
            <span class="office-character__body"></span>
            <span class="office-character__shirt"></span>
            <span class="office-character__tie"></span>
            <span class="office-character__badge">백</span>
            <span class="office-character__head"></span>
            <span class="office-character__hair"></span>
            <span class="office-character__eye office-character__eye--left"></span>
            <span class="office-character__eye office-character__eye--right"></span>
            <span class="office-character__mouth"></span>
        </div>
        <div>
            <p class="speech-bubble mb-2">오늘의 퀘스트를 한눈에 확인해요.</p>
            <h1 class="h3 mb-1">퀘스트 보드</h1>
            <p class="text-muted mb-0">완료하지 않은 퀘스트만 완료 버튼이 표시됩니다.</p>
        </div>
    </section>

    <section class="soft-card">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
            <h2 class="section-title">전체 퀘스트 <small>최근 등록순으로 확인하기</small></h2>
        </div>

        <div th:if="${#lists.isEmpty(quests)}" class="empty-state">
            아직 등록된 퀘스트가 없습니다.
        </div>

        <div class="quest-list" th:unless="${#lists.isEmpty(quests)}">
            <article class="quest-item" th:each="quest : ${quests}">
                <div class="quest-main">
                    <strong class="quest-title" th:text="${quest.title}">퀘스트 제목</strong>
                    <p class="text-muted small mb-1" th:text="${quest.description}">설명</p>
                    <div class="quest-meta">
                        <span class="badge badge-soft" th:text="${quest.categoryDisplayName}">백엔드</span>
                        <span class="badge badge-soft" th:text="${quest.subCategoryDisplayName}">API 설계</span>
                        <span class="badge text-bg-warning" th:text="${quest.difficultyLabel}">쉬움</span>
                        <span class="badge badge-exp" th:text="${quest.expReward} + ' EXP'">10 EXP</span>
                        <span class="badge text-bg-light" th:text="${quest.statusLabel}">진행 전</span>
                    </div>
                </div>
                <div class="quest-actions">
                    <form th:if="${quest.ready}" th:action="@{/quests/{id}/complete(id=${quest.id})}" method="post">
                        <button class="btn btn-outline-success btn-sm" type="submit">완료</button>
                    </form>
                    <span th:unless="${quest.ready}" class="badge text-bg-success">완료됨</span>
                </div>
            </article>
        </div>
    </section>
</main>
</body>
</html>
