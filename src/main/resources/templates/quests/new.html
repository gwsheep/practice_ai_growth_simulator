<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>퀘스트 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/quest-form.js}"></script>
</head>
<body>
<main class="container page-shell py-4">
    <nav class="top-nav">
        <div class="brand-mark">
            <span class="office-character brand-mascot" aria-hidden="true">
                <span class="office-character__body"></span>
                <span class="office-character__shirt"></span>
                <span class="office-character__tie"></span>
                <span class="office-character__badge">백</span>
                <span class="office-character__head"></span>
                <span class="office-character__hair"></span>
                <span class="office-character__eye office-character__eye--left"></span>
                <span class="office-character__eye office-character__eye--right"></span>
                <span class="office-character__mouth"></span>
            </span>
            <span>퀘스트 등록</span>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/dashboard}">대시보드</a>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/quests}">목록</a>
        </div>
    </nav>

    <section class="hero-panel mb-4">
        <div class="office-character" aria-hidden="true">
            <span class="office-character__body"></span>
            <span class="office-character__shirt"></span>
            <span class="office-character__tie"></span>
            <span class="office-character__badge">백</span>
            <span class="office-character__head"></span>
            <span class="office-character__hair"></span>
            <span class="office-character__eye office-character__eye--left"></span>
            <span class="office-character__eye office-character__eye--right"></span>
            <span class="office-character__mouth"></span>
        </div>
        <div>
            <p class="speech-bubble mb-2">이번 퀘스트가 어떤 성장 항목인지 골라볼까요?</p>
            <h1 class="h3 mb-1">새 퀘스트 만들기</h1>
            <p class="text-muted mb-0">대분류를 고르면 해당 중분류만 선택할 수 있습니다.</p>
        </div>
    </section>

    <section class="soft-card form-panel">
        <form class="quest-form" th:action="@{/quests}" th:object="${questCreateRequest}" method="post">
            <div>
                <label class="form-label" for="title">퀘스트 제목</label>
                <input class="form-control" id="title" type="text" th:field="*{title}" required maxlength="100"
                       placeholder="예: Spring MVC 예외 처리 정리하기">
            </div>

            <div>
                <label class="form-label" for="description">설명</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="4"
                          placeholder="퀘스트 내용을 짧게 적어주세요."></textarea>
            </div>

            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="categoryId">성장 대분류</label>
                    <select class="form-select" id="categoryId" data-category-select>
                        <option th:each="category : ${growthCategories}"
                                th:value="${category.id}"
                                th:text="${category.displayName}">백엔드</option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="subCategoryId">성장 중분류</label>
                    <select class="form-select" id="subCategoryId" th:field="*{subCategoryId}" data-sub-category-select required>
                        <option th:each="subCategory : ${growthSubCategories}"
                                th:value="${subCategory.id}"
                                th:attr="data-category-id=${subCategory.category.id}"
                                th:text="${subCategory.displayName}">API 설계</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="form-label" for="difficulty">난이도</label>
                <select class="form-select" id="difficulty" th:field="*{difficulty}">
                    <option th:each="difficulty : ${difficulties}"
                            th:value="${difficulty}"
                            th:text="${difficulty.label + ' / ' + difficulty.expReward + ' EXP'}">쉬움</option>
                </select>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/dashboard}">취소</a>
                <button class="btn btn-primary" type="submit">등록</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
