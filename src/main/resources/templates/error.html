<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>요청 안내</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container page-shell py-4">
    <section class="hero-panel mb-4">
        <div class="office-character" aria-hidden="true">
            <span class="office-character__body"></span>
            <span class="office-character__shirt"></span>
            <span class="office-character__tie"></span>
            <span class="office-character__badge">백</span>
            <span class="office-character__head"></span>
            <span class="office-character__hair"></span>
            <span class="office-character__eye office-character__eye--left"></span>
            <span class="office-character__eye office-character__eye--right"></span>
            <span class="office-character__mouth"></span>
        </div>
        <div>
            <p class="speech-bubble mb-2">괜찮아요. 퀘스트 상태를 다시 확인해 볼게요.</p>
            <h1 class="h3 mb-1" th:text="${errorTitle} ?: '요청을 처리하지 못했습니다.'">요청을 처리하지 못했습니다.</h1>
            <p class="text-muted mb-0" th:text="${guideMessage} ?: '대시보드로 돌아가 다시 시도해 주세요.'">대시보드로 돌아가 다시 시도해 주세요.</p>
        </div>
    </section>

    <section class="soft-card">
        <h2 class="section-title mb-2">안내 메시지</h2>
        <p class="text-muted mb-3" th:text="${errorMessage} ?: '잠시 후 다시 시도해 주세요.'">잠시 후 다시 시도해 주세요.</p>
        <div class="d-flex gap-2">
            <a class="btn btn-primary" th:href="@{/dashboard}">대시보드로 이동</a>
            <a class="btn btn-outline-secondary" th:href="@{/quests}">퀘스트 목록</a>
        </div>
    </section>
</main>
</body>
</html>
