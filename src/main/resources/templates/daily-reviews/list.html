<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Review</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/game-ui.css}">
</head>
<body>
<main class="container page-shell app-shell py-4">
    <nav th:replace="~{fragments/navigation :: nav('reviews')}"></nav>

    <section class="hero-panel mb-4">
        <div class="office-character" aria-hidden="true">
            <span class="office-character__body"></span>
            <span class="office-character__shirt"></span>
            <span class="office-character__tie"></span>
            <span class="office-character__badge">백</span>
            <span class="office-character__head"></span>
            <span class="office-character__hair"></span>
            <span class="office-character__eye office-character__eye--left"></span>
            <span class="office-character__eye office-character__eye--right"></span>
            <span class="office-character__mouth"></span>
        </div>
        <div>
            <p class="speech-bubble mb-2">오늘 배운 것을 한 줄만 남겨도 내일의 힌트가 됩니다.</p>
            <h1 class="h3 mb-1">회고 보드</h1>
            <p class="text-muted mb-0">하루 하나의 짧은 기록을 쌓습니다.</p>
        </div>
    </section>

    <div th:if="${noticeMessage}" class="alert alert-success" th:text="${noticeMessage}"></div>

    <section class="soft-card">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
            <h2 class="section-title">최근 회고 <small>날짜 기준 최신순</small></h2>
            <a class="btn btn-primary btn-sm" th:href="@{/daily-reviews/new}">오늘 회고 작성</a>
        </div>

        <div th:if="${#lists.isEmpty(reviews)}" class="empty-state">
            아직 작성된 회고가 없습니다.
        </div>

        <div class="quest-list" th:unless="${#lists.isEmpty(reviews)}">
            <article class="quest-item" th:each="review : ${reviews}">
                <div class="quest-main">
                    <strong class="quest-title" th:text="${review.reviewDateText}">2026.05.14</strong>
                    <p class="text-muted small mb-1" th:text="${review.learnedText}">오늘 배운 것</p>
                    <div class="quest-meta">
                        <span class="badge badge-exp" th:text="'기분 ' + ${review.moodScore} + ' · ' + ${review.moodLabel}">기분 3</span>
                        <span class="badge badge-soft" th:text="${review.categoryDisplayName}">백엔드</span>
                        <span class="badge badge-soft" th:text="${review.subCategoryDisplayName}">API 설계</span>
                    </div>
                </div>
                <div class="quest-actions">
                    <a class="btn btn-outline-secondary btn-sm" th:href="@{/daily-reviews/{id}(id=${review.id})}">보기</a>
                    <a class="btn btn-outline-primary btn-sm" th:href="@{/daily-reviews/{id}/edit(id=${review.id})}">수정</a>
                </div>
            </article>
        </div>
    </section>
</main>
</body>
</html>
