<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Review 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/game-ui.css}">
    <script defer th:src="@{/js/quest-form.js}"></script>
</head>
<body>
<main class="container page-shell app-shell py-4">
    <nav th:replace="~{fragments/navigation :: nav('reviews')}"></nav>

    <section class="hero-panel mb-4">
        <div class="office-character" aria-hidden="true">
            <span class="office-character__body"></span>
            <span class="office-character__shirt"></span>
            <span class="office-character__tie"></span>
            <span class="office-character__badge">백</span>
            <span class="office-character__head"></span>
            <span class="office-character__hair"></span>
            <span class="office-character__eye office-character__eye--left"></span>
            <span class="office-character__eye office-character__eye--right"></span>
            <span class="office-character__mouth"></span>
        </div>
        <div>
            <p class="speech-bubble mb-2">회고는 길지 않아도 괜찮아요. 오늘의 흔적만 남겨요.</p>
            <h1 class="h3 mb-1" th:text="${editMode ? '오늘의 기록 다듬기' : '오늘의 회고'}">오늘의 회고</h1>
            <p class="text-muted mb-0">EXP는 Quest 완료에서만 쌓이고, 회고는 다음 성장을 위한 기록으로 저장됩니다.</p>
        </div>
    </section>

    <section class="soft-card form-panel">
        <form class="quest-form"
              th:action="${editMode ? '/daily-reviews/' + review.id + '/edit' : '/daily-reviews'}"
              th:object="${reviewForm}"
              method="post">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="reviewDate">회고 날짜</label>
                    <input class="form-control" id="reviewDate" type="date" th:field="*{reviewDate}" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="moodScore">기분 점수</label>
                    <select class="form-select" id="moodScore" th:field="*{moodScore}">
                        <option value="1">1점 · 매우 힘듦</option>
                        <option value="2">2점 · 힘듦</option>
                        <option value="3">3점 · 보통</option>
                        <option value="4">4점 · 좋음</option>
                        <option value="5">5점 · 아주 좋음</option>
                    </select>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="categoryId">성장 대분류</label>
                    <select class="form-select" id="categoryId" data-category-select>
                        <option value="">선택 안 함</option>
                        <option th:each="category : ${growthCategories}"
                                th:value="${category.id}"
                                th:text="${category.displayName}">백엔드</option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="relatedGrowthSubCategoryId">성장 중분류</label>
                    <select class="form-select" id="relatedGrowthSubCategoryId"
                            th:field="*{relatedGrowthSubCategoryId}" data-sub-category-select>
                        <option value="">선택 안 함</option>
                        <option th:each="subCategory : ${growthSubCategories}"
                                th:value="${subCategory.id}"
                                th:attr="data-category-id=${subCategory.category.id}"
                                th:text="${subCategory.displayName}">API 설계</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="form-label" for="learnedText">오늘 배운 것</label>
                <textarea class="form-control" id="learnedText" th:field="*{learnedText}" rows="3"
                          placeholder="예: JPA 변경 감지 흐름을 정리했다."></textarea>
            </div>

            <div>
                <label class="form-label" for="difficultyText">힘들었던 점</label>
                <textarea class="form-control" id="difficultyText" th:field="*{difficultyText}" rows="3"
                          placeholder="예: 테스트 범위를 어디까지 잡을지 헷갈렸다."></textarea>
            </div>

            <div>
                <label class="form-label" for="tomorrowPlanText">내일 할 일</label>
                <textarea class="form-control" id="tomorrowPlanText" th:field="*{tomorrowPlanText}" rows="3"
                          placeholder="예: Daily Review Service 테스트를 보강한다."></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/daily-reviews}">취소</a>
                <button class="btn btn-primary" type="submit">저장</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
