<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Review 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container page-shell py-4">
    <nav class="top-nav">
        <div class="brand-mark">
            <span>Daily Review</span>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/dashboard}">대시보드</a>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/daily-reviews}">목록</a>
            <a class="btn btn-primary btn-sm" th:href="@{/daily-reviews/{id}/edit(id=${review.id})}">수정</a>
        </div>
    </nav>

    <div th:if="${noticeMessage}" class="alert alert-success" th:text="${noticeMessage}"></div>

    <section class="hero-panel mb-4">
        <div class="office-character" aria-hidden="true">
            <span class="office-character__body"></span>
            <span class="office-character__shirt"></span>
            <span class="office-character__tie"></span>
            <span class="office-character__badge">백</span>
            <span class="office-character__head"></span>
            <span class="office-character__hair"></span>
            <span class="office-character__eye office-character__eye--left"></span>
            <span class="office-character__eye office-character__eye--right"></span>
            <span class="office-character__mouth"></span>
        </div>
        <div>
            <p class="speech-bubble mb-2">힘들었던 점도 성장 데이터예요.</p>
            <h1 class="h3 mb-1" th:text="${review.reviewDateText}">2026.05.14</h1>
            <p class="text-muted mb-0">
                <span th:text="'기분 ' + ${review.moodScore} + ' · ' + ${review.moodLabel}">기분 3 · 보통</span>
                <span> · </span>
                <span th:text="${review.subCategoryDisplayName}">API 설계</span>
            </p>
        </div>
    </section>

    <section class="soft-card mb-3">
        <h2 class="section-title mb-2">오늘 배운 것</h2>
        <p class="mb-0 text-muted" th:text="${review.learnedText}">배운 내용</p>
    </section>

    <section class="soft-card mb-3">
        <h2 class="section-title mb-2">힘들었던 점</h2>
        <p class="mb-0 text-muted" th:text="${review.difficultyText}">힘들었던 점</p>
    </section>

    <section class="soft-card">
        <h2 class="section-title mb-2">내일 할 일</h2>
        <p class="mb-0 text-muted" th:text="${review.tomorrowPlanText}">내일 할 일</p>
    </section>

    <div class="d-flex justify-content-end gap-2 mt-3">
        <form th:action="@{/daily-reviews/{id}/delete(id=${review.id})}" method="post">
            <button class="btn btn-outline-danger" type="submit">삭제</button>
        </form>
    </div>
</main>
</body>
</html>
