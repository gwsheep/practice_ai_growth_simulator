<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editMode} ? '몬스터 수정' : '몬스터 등록'">몬스터 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container page-shell py-4">
    <nav class="top-nav">
        <div class="brand-mark">
            <span class="office-character brand-mascot" aria-hidden="true">
                <span class="office-character__body"></span>
                <span class="office-character__shirt"></span>
                <span class="office-character__tie"></span>
                <span class="office-character__badge">백</span>
                <span class="office-character__head"></span>
                <span class="office-character__hair"></span>
                <span class="office-character__eye office-character__eye--left"></span>
                <span class="office-character__eye office-character__eye--right"></span>
                <span class="office-character__mouth"></span>
            </span>
            <span th:text="${editMode} ? '몬스터 수정' : '몬스터 등록'">몬스터 등록</span>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/monsters}">몬스터 목록</a>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/dashboard}">대시보드</a>
        </div>
    </nav>

    <section class="hero-panel mb-4">
        <div class="office-character" aria-hidden="true">
            <span class="office-character__body"></span>
            <span class="office-character__shirt"></span>
            <span class="office-character__tie"></span>
            <span class="office-character__badge">백</span>
            <span class="office-character__head"></span>
            <span class="office-character__hair"></span>
            <span class="office-character__eye office-character__eye--left"></span>
            <span class="office-character__eye office-character__eye--right"></span>
            <span class="office-character__mouth"></span>
        </div>
        <div>
            <p class="speech-bubble mb-2">이름을 붙이면 공략법을 찾기 쉬워져요.</p>
            <h1 class="h3 mb-1" th:text="${editMode} ? '몬스터 정보 수정' : '새 몬스터 등록'">새 몬스터 등록</h1>
            <p class="text-muted mb-0">보상 EXP는 이번 MVP에서 실제 성장 EXP로 반영하지 않습니다.</p>
        </div>
    </section>

    <section class="soft-card form-panel">
        <form class="quest-form"
              th:object="${monsterForm}"
              th:action="${editMode} ? @{/monsters/{id}/edit(id=${monster.id})} : @{/monsters}"
              method="post">
            <div>
                <label class="form-label" for="name">이름</label>
                <input class="form-control" id="name" type="text" th:field="*{name}" placeholder="예: 레거시 코드 늪">
            </div>
            <div>
                <label class="form-label" for="code">코드</label>
                <input class="form-control" id="code" type="text" th:field="*{code}" placeholder="예: LEGACY_SWAMP">
            </div>
            <div>
                <label class="form-label" for="description">설명</label>
                <textarea class="form-control" id="description" rows="4" th:field="*{description}"
                          placeholder="요즘 어떤 문제로 느껴지는지 적어주세요."></textarea>
            </div>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="monsterType">타입</label>
                    <select class="form-select" id="monsterType" th:field="*{monsterType}">
                        <option th:each="type : ${monsterTypes}" th:value="${type}" th:text="${type.label}">기타</option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="difficulty">난이도</label>
                    <select class="form-select" id="difficulty" th:field="*{difficulty}">
                        <option th:each="difficulty : ${monsterDifficulties}"
                                th:value="${difficulty}"
                                th:text="${difficulty.label} + ' · 기본 HP ' + ${difficulty.defaultMaxHp}">보통</option>
                    </select>
                </div>
            </div>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="maxHp">최대 HP</label>
                    <input class="form-control" id="maxHp" type="number" min="1" step="1" th:field="*{maxHp}">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="rewardExp">표시용 보상 EXP</label>
                    <input class="form-control" id="rewardExp" type="number" min="0" step="1" th:field="*{rewardExp}">
                </div>
            </div>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="relatedGrowthCategoryId">관련 성장 대분류</label>
                    <select class="form-select" id="relatedGrowthCategoryId" th:field="*{relatedGrowthCategoryId}">
                        <option value="">선택 안 함</option>
                        <option th:each="category : ${growthCategories}"
                                th:value="${category.id}"
                                th:text="${category.displayName}">백엔드</option>
                    </select>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="relatedGrowthSubCategoryId">관련 성장 중분류</label>
                    <select class="form-select" id="relatedGrowthSubCategoryId" th:field="*{relatedGrowthSubCategoryId}">
                        <option value="">선택 안 함</option>
                        <option th:each="subCategory : ${growthSubCategories}"
                                th:value="${subCategory.id}"
                                th:text="${subCategory.label}">API 설계</option>
                    </select>
                </div>
            </div>
            <div class="d-flex gap-2 justify-content-end">
                <a class="btn btn-outline-secondary" th:href="@{/monsters}">취소</a>
                <button class="btn btn-primary" type="submit" th:text="${editMode} ? '수정' : '등록'">등록</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
