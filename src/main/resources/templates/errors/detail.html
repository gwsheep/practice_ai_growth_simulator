<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${errorRecord.title}">Error Museum</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/game-ui.css}">
</head>
<body>
<main class="container page-shell py-4">
    <nav th:replace="~{fragments/navigation :: nav('errors')}"></nav>

    <div th:if="${noticeMessage}" class="alert alert-success" th:text="${noticeMessage}"></div>

    <section class="exhibit-hero mb-4">
        <div class="mascot-panel">
            <div class="office-character" aria-hidden="true">
                <span class="office-character__body"></span>
                <span class="office-character__shirt"></span>
                <span class="office-character__tie"></span>
                <span class="office-character__badge">백</span>
                <span class="office-character__head"></span>
                <span class="office-character__hair"></span>
                <span class="office-character__eye office-character__eye--left"></span>
                <span class="office-character__eye office-character__eye--right"></span>
                <span class="office-character__mouth"></span>
            </div>
        <div>
            <span class="game-hero__eyebrow">MUSEUM EXHIBIT</span>
            <p class="speech-bubble mb-2">같은 에러를 다시 만나도, 이제는 힌트가 있어요.</p>
            <h1 class="h3 mb-2" th:text="${errorRecord.title}">에러 제목</h1>
            <div class="museum-card__meta">
                <span class="status-badge" th:text="${errorRecord.errorName}">에러명</span>
                <span class="status-badge" th:text="${errorRecord.statusLabel}">수집 중</span>
                <span class="severity-badge" th:text="${errorRecord.severityLabel}">주의</span>
                <span class="status-badge" th:text="${errorRecord.growthSubCategoryDisplayName}">Spring Boot</span>
            </div>
        </div>
        </div>
    </section>

    <section class="game-grid game-grid--two mb-4">
        <article class="exhibit-card">
            <h2 class="section-title mb-3">발생 상황</h2>
            <p class="exhibit-card__body mb-0" th:text="${errorRecord.situation}">상황</p>
        </article>
        <article class="exhibit-card">
            <h2 class="section-title mb-3">원인</h2>
            <p class="exhibit-card__body mb-0"
               th:text="${#strings.isEmpty(errorRecord.cause) ? '아직 원인을 정리하지 않았습니다.' : errorRecord.cause}">원인</p>
        </article>
        <article class="exhibit-card">
            <h2 class="section-title mb-3">해결 방법</h2>
            <p class="exhibit-card__body mb-0"
               th:text="${#strings.isEmpty(errorRecord.solution) ? '해결 방법이 비어 있습니다.' : errorRecord.solution}">해결</p>
        </article>
        <article class="exhibit-card">
            <h2 class="section-title mb-3">메모</h2>
            <p class="exhibit-card__body mb-0"
               th:text="${#strings.isEmpty(errorRecord.memo) ? '추가 메모가 없습니다.' : errorRecord.memo}">메모</p>
        </article>
    </section>

    <section class="exhibit-card mb-4">
        <h2 class="section-title mb-3">연결 정보</h2>
        <div class="game-grid">
            <article class="stat-card">
                <span>성장 영역</span>
                <strong th:text="${errorRecord.growthCategoryDisplayName}">Framework</strong>
                <small th:text="${errorRecord.growthSubCategoryDisplayName}">Spring Boot</small>
            </article>
            <article class="stat-card">
                <span>연결 Quest</span>
                <strong th:text="${errorRecord.questTitle}">연결된 Quest 없음</strong>
                <small>선택 연결</small>
            </article>
            <article class="stat-card">
                <span>발생일시</span>
                <strong th:text="${#temporals.format(errorRecord.occurredAt, 'MM.dd HH:mm')}">05.21 10:00</strong>
                <small>기록 기준</small>
            </article>
            <article class="stat-card">
                <span>해결일시</span>
                <strong th:text="${errorRecord.resolvedAt == null ? '아직 없음' : #temporals.format(errorRecord.resolvedAt, 'MM.dd HH:mm')}">아직 없음</strong>
                <small>해결 처리 시 자동 기록</small>
            </article>
        </div>
    </section>

    <section class="exhibit-card">
        <div class="action-dock justify-content-end">
            <a class="secondary-button" th:href="@{/errors/{id}/edit(id=${errorRecord.id})}">수정</a>
            <form th:if="${errorRecord.open}" th:action="@{/errors/{id}/resolve(id=${errorRecord.id})}" method="post">
                <button class="action-button" type="submit">해결 처리</button>
            </form>
            <form th:unless="${errorRecord.archived}" th:action="@{/errors/{id}/archive(id=${errorRecord.id})}" method="post">
                <button class="secondary-button" type="submit">보관</button>
            </form>
            <form th:action="@{/errors/{id}/delete(id=${errorRecord.id})}" method="post">
                <button class="btn btn-outline-danger" type="submit">삭제</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
