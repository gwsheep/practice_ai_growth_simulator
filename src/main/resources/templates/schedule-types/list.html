<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>일정 타입 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container page-shell py-4">
    <nav class="top-nav">
        <div class="brand-mark">
            <span class="office-character brand-mascot" aria-hidden="true">
                <span class="office-character__body"></span>
                <span class="office-character__shirt"></span>
                <span class="office-character__tie"></span>
                <span class="office-character__badge">백</span>
                <span class="office-character__head"></span>
                <span class="office-character__hair"></span>
                <span class="office-character__eye office-character__eye--left"></span>
                <span class="office-character__eye office-character__eye--right"></span>
                <span class="office-character__mouth"></span>
            </span>
            <span>일정 타입 관리</span>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/schedules}">일정</a>
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/dashboard}">대시보드</a>
            <a class="btn btn-primary btn-sm" th:href="@{/schedule-types/new}">타입 추가</a>
        </div>
    </nav>

    <section class="hero-panel mb-4">
        <div class="office-character" aria-hidden="true">
            <span class="office-character__body"></span>
            <span class="office-character__shirt"></span>
            <span class="office-character__tie"></span>
            <span class="office-character__badge">백</span>
            <span class="office-character__head"></span>
            <span class="office-character__hair"></span>
            <span class="office-character__eye office-character__eye--left"></span>
            <span class="office-character__eye office-character__eye--right"></span>
            <span class="office-character__mouth"></span>
        </div>
        <div>
            <p class="speech-bubble mb-2">자주 쓰는 계획 분류를 직접 다듬을 수 있어요.</p>
            <h1 class="h3 mb-1">일정 타입 보드</h1>
            <p class="text-muted mb-0">비활성화된 타입은 기존 일정에는 남지만 새 일정 등록에서는 숨겨집니다.</p>
        </div>
    </section>

    <div th:if="${noticeMessage}" class="alert alert-success" th:text="${noticeMessage}"></div>

    <section class="soft-card">
        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
            <h2 class="section-title">전체 타입 <small>정렬 순서 기준</small></h2>
            <a class="btn btn-primary btn-sm" th:href="@{/schedule-types/new}">타입 추가</a>
        </div>

        <div th:if="${#lists.isEmpty(scheduleTypes)}" class="empty-state">
            아직 등록된 일정 타입이 없습니다.
        </div>

        <div class="quest-list" th:unless="${#lists.isEmpty(scheduleTypes)}">
            <article class="quest-item" th:each="scheduleType : ${scheduleTypes}">
                <div class="quest-main">
                    <strong class="quest-title" th:text="${scheduleType.name}">공부</strong>
                    <p class="text-muted small mb-1" th:text="${scheduleType.description}">설명</p>
                    <div class="quest-meta">
                        <span class="badge badge-soft" th:text="${scheduleType.code}">STUDY</span>
                        <span class="badge badge-soft" th:text="'정렬 ' + ${scheduleType.sortOrder}">정렬 10</span>
                        <span class="badge text-bg-success" th:if="${scheduleType.active}">활성</span>
                        <span class="badge text-bg-secondary" th:unless="${scheduleType.active}">비활성</span>
                        <span class="badge badge-soft">
                            <span class="color-dot" th:style="'background: ' + ${scheduleType.color}"></span>
                            <span th:text="${scheduleType.color}">#4d78b8</span>
                        </span>
                    </div>
                </div>
                <div class="quest-actions">
                    <a class="btn btn-outline-secondary btn-sm" th:href="@{/schedule-types/{id}/edit(id=${scheduleType.id})}">수정</a>
                    <form th:if="${scheduleType.active}" th:action="@{/schedule-types/{id}/delete(id=${scheduleType.id})}" method="post">
                        <button class="btn btn-outline-danger btn-sm" type="submit">비활성화</button>
                    </form>
                </div>
            </article>
        </div>
    </section>
</main>
</body>
</html>
