<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>일정 타입 편집</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/game-ui.css}">
</head>
<body>
<main class="container page-shell app-shell py-4">
    <nav th:replace="~{fragments/navigation :: nav('schedules')}"></nav>

    <section class="soft-card form-panel">
        <h1 class="h4 mb-3" th:text="${editMode ? '일정 타입 수정' : '새 일정 타입'}">새 일정 타입</h1>
        <form class="quest-form"
              th:action="${editMode ? '/schedule-types/' + scheduleType.id + '/edit' : '/schedule-types'}"
              th:object="${scheduleTypeForm}"
              method="post">
            <div>
                <label class="form-label" for="code">코드</label>
                <input class="form-control" id="code" type="text" th:field="*{code}" required maxlength="50"
                       placeholder="예: CERTIFICATE">
            </div>
            <div>
                <label class="form-label" for="name">이름</label>
                <input class="form-control" id="name" type="text" th:field="*{name}" required maxlength="80"
                       placeholder="예: 자격증">
            </div>
            <div>
                <label class="form-label" for="description">설명</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="4"
                          placeholder="타입 설명을 적어주세요."></textarea>
            </div>
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="color">색상</label>
                    <input class="form-control form-control-color" id="color" type="color" th:field="*{color}">
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="sortOrder">정렬 순서</label>
                    <input class="form-control" id="sortOrder" type="number" th:field="*{sortOrder}">
                </div>
            </div>
            <div class="form-check" th:if="${editMode}">
                <input class="form-check-input" id="active" type="checkbox" th:field="*{active}">
                <label class="form-check-label" for="active">활성 상태</label>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/schedule-types}">취소</a>
                <button class="btn btn-primary" type="submit">저장</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
