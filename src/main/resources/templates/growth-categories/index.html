<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>성장 항목 편집</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/growth-manage.css}">
</head>
<body>
<main class="container page-shell py-4">
    <nav class="top-nav">
        <div class="brand-mark">
            <span class="office-character brand-mascot" aria-hidden="true">
                <span class="office-character__body"></span>
                <span class="office-character__shirt"></span>
                <span class="office-character__tie"></span>
                <span class="office-character__badge">백</span>
                <span class="office-character__head"></span>
                <span class="office-character__hair"></span>
                <span class="office-character__eye office-character__eye--left"></span>
                <span class="office-character__eye office-character__eye--right"></span>
                <span class="office-character__mouth"></span>
            </span>
            <span>성장 항목 편집</span>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/dashboard}">대시보드</a>
            <a class="btn btn-primary btn-sm" th:href="@{/growth-categories/new}">대분류 추가</a>
        </div>
    </nav>

    <section class="hero-panel mb-4">
        <div class="office-character" aria-hidden="true">
            <span class="office-character__body"></span>
            <span class="office-character__shirt"></span>
            <span class="office-character__tie"></span>
            <span class="office-character__badge">백</span>
            <span class="office-character__head"></span>
            <span class="office-character__hair"></span>
            <span class="office-character__eye office-character__eye--left"></span>
            <span class="office-character__eye office-character__eye--right"></span>
            <span class="office-character__mouth"></span>
        </div>
        <div>
            <p class="speech-bubble mb-2">성장 지도를 직접 다듬어볼까요?</p>
            <h1 class="h3 mb-1">성장 카테고리 관리</h1>
            <p class="text-muted mb-0">퀘스트에서 사용할 대분류와 중분류를 편집합니다.</p>
        </div>
    </section>

    <div th:if="${noticeMessage}" class="alert alert-success" th:text="${noticeMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-warning" th:text="${errorMessage}"></div>

    <section class="growth-manage-list">
        <article class="growth-manage-card" th:each="view : ${categoryViews}">
            <div class="growth-manage-card__head">
                <div>
                    <div class="growth-manage-card__title">
                        <strong th:text="${view.category.displayName}">백엔드</strong>
                        <span th:text="${view.category.name}">BACKEND</span>
                    </div>
                    <p th:text="${view.category.description}">설명</p>
                    <small th:text="'정렬 순서 ' + ${view.category.sortOrder}">정렬 순서 1</small>
                </div>
                <div class="growth-actions">
                    <a class="btn btn-outline-primary btn-sm" th:href="@{/growth-categories/{id}/sub-categories/new(id=${view.category.id})}">중분류 추가</a>
                    <a class="btn btn-outline-secondary btn-sm" th:href="@{/growth-categories/{id}/edit(id=${view.category.id})}">수정</a>
                    <form th:action="@{/growth-categories/{id}/delete(id=${view.category.id})}" method="post">
                        <button class="btn btn-outline-danger btn-sm" type="submit">삭제</button>
                    </form>
                </div>
            </div>

            <div class="growth-manage-sub-list" th:if="${!#lists.isEmpty(view.subCategories)}">
                <div class="growth-manage-sub-item" th:each="subCategory : ${view.subCategories}">
                    <div>
                        <strong th:text="${subCategory.displayName}">API 설계</strong>
                        <span th:text="${subCategory.name}">API_DESIGN</span>
                        <p th:text="${subCategory.description}">설명</p>
                        <small th:text="'Lv. ' + ${subCategory.level} + ' · 누적 ' + ${subCategory.totalExp} + ' EXP · 정렬 ' + ${subCategory.sortOrder}">Lv. 1</small>
                    </div>
                    <div class="growth-actions">
                        <a class="btn btn-outline-secondary btn-sm" th:href="@{/growth-sub-categories/{id}/edit(id=${subCategory.id})}">수정</a>
                        <form th:action="@{/growth-sub-categories/{id}/delete(id=${subCategory.id})}" method="post">
                            <button class="btn btn-outline-danger btn-sm" type="submit">삭제</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="empty-state" th:if="${#lists.isEmpty(view.subCategories)}">
                아직 중분류가 없습니다.
            </div>
        </article>
    </section>
</main>
</body>
</html>
